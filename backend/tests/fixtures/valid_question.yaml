id: beh-verification-01
type: behavioral
prompt: "Tell me about a time you found a significant error in your own work."
tags: [ownership, rigor]
time_budget_s: 240
max_probes: 2
probes:
  - trigger: "doesn't explain how the error was detected"
    ask: "What made you think to check?"
  - trigger: "no lasting change described"
    ask: "What do you do differently now?"
rubric:
  - criterion: detection_process
    weight: 2
    anchors:
      1: "Error found by luck or by someone else"
      3: "Describes the check vaguely"
      5: "Deliberate independent verification, explains why that source"
  - criterion: impact_quantified
    weight: 1
    anchors:
      1: "No sense of scale"
      3: "Qualitative impact"
      5: "Concrete magnitude and consequence"
  - criterion: lasting_change
    weight: 1
    anchors:
      1: "None"
      3: "Fixed the instance"
      5: "Changed process or habit, with an example"
rubric_version: 1